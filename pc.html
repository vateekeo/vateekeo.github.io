<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Мой ПК</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0e0e12;
            background-image: radial-gradient(circle at 20% 20%, #1a1a24 0%, #0a0a0e 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
        }

        .site-wrapper {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 3.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .main-title {
            text-align: center;
            font-size: clamp(2.6rem, 12vw, 4.6rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #f0f3fa;
            text-shadow: 0 0 12px rgba(100, 180, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.6);
            margin-bottom: 2.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            word-break: break-word;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            justify-content: center;
        }

        .button-card {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .accordion-btn {
            width: 100%;
            padding: 1rem 0.8rem;
            background: #21212b;
            border: 1px solid #3b3b4a;
            border-radius: 2rem;
            color: #eaeef7;
            font-size: 1rem;
            font-weight: 550;
            letter-spacing: 0.03em;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #0b0b0f, 0 8px 16px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            background: linear-gradient(145deg, #292936, #1b1b24);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            line-height: 1.4;
            word-break: break-word;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .accordion-btn:hover {
            background: #323244;
            border-color: #5f5f7a;
            transform: scale(1.02);
            box-shadow: 0 6px 0 #0b0b0f, 0 10px 20px rgba(0, 0, 0, 0.7);
        }

        .accordion-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0b0b0f;
        }

        .spoiler-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
            background: rgba(14, 14, 20, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 0 0 1.8rem 1.8rem;
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.4);
            width: 100%;
            pointer-events: none;
        }

        .spoiler-panel.active {
            max-height: 800px;
            opacity: 1;
            margin-top: 0.6rem;
            padding: 0.8rem 0.8rem 1.2rem;
            pointer-events: auto;
            transition: max-height 0.5s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s ease, margin 0.3s ease;
        }

        .spoiler-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
        }

        /* описание над картинкой */
        .spoiler-description {
            color: #c8d6f0;
            font-size: 0.95rem;
            font-weight: 450;
            text-align: center;
            letter-spacing: 0.02em;
            padding: 0.2rem 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            word-break: break-word;
            line-height: 1.4;
        }

        .spoiler-content .img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: all 0.25s ease;
            cursor: zoom-in;
        }

        .spoiler-content .img-wrapper.expanded {
            cursor: zoom-out;
        }

        .spoiler-content img {
            width: 100%;
            max-width: 220px;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1.4rem;
            border: 1px solid #3d3d52;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
            background: #14141c;
            transition: all 0.25s ease;
            display: block;
        }

        /* увеличенное состояние картинки (full size) */
        .spoiler-content .img-wrapper.expanded img {
            max-width: 100%;
            width: 100%;
            aspect-ratio: auto;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(80, 140, 255, 0.25);
        }

        .spoiler-content a {
            color: #b4caf0;
            font-size: 0.95rem;
            font-weight: 450;
            letter-spacing: 0.02em;
            text-decoration: none;
            border-bottom: 1px dashed rgba(180, 202, 240, 0.3);
            padding: 0.25rem 0.4rem;
            transition: 0.2s;
            word-break: break-word;
            text-align: center;
            width: 100%;
        }

        .spoiler-content a:hover {
            color: #d6e5ff;
            border-bottom: 1px solid #8ab3ff;
            text-shadow: 0 0 6px rgba(100, 170, 255, 0.3);
        }

        @media (max-width: 480px) {
            .site-wrapper {
                padding: 1.5rem 0.8rem;
                border-radius: 2.2rem;
            }
            .buttons-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.9rem;
            }
            .accordion-btn {
                font-size: 0.9rem;
                padding: 0.8rem 0.4rem;
                min-height: 56px;
                border-radius: 1.8rem;
            }
            .spoiler-content img {
                max-width: 150px;
            }
            .spoiler-content .img-wrapper.expanded img {
                max-width: 100%;
            }
        }

        @media (max-width: 380px) {
            .buttons-grid {
                grid-template-columns: 1fr;
                gap: 0.9rem;
            }
        }

        @media (min-width: 1100px) {
            .buttons-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .spoiler-panel:not(.active) .spoiler-content {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <h1 class="main-title">Мой ПК</h1>
        <div class="buttons-grid" id="buttonGrid"></div>
    </div>

    <script>
        (function() {
            const items = [
                { label: "Процессор", img: "img/pc/amd.jpg", description: "AMD Ryzen 5 5600 (AM4, 6 ядер, 12 потоков, 3.5 ГГц)", linkText: "AMD Ryzen5 5600", linkUrl: "https://www.citilink.ru/product/processor-amd-ryzen-5-5600-am4-oem-100-000000927-1970792/" },
                { label: "Материнская плата", img: "img/pc/mother_board.png", description: "Gigabyte B550M AORUS ELITE (AM4, AMD B550, mATX)", linkText: "Gigabyte B550M AORUS ELITE", linkUrl: "https://www.gigabyte.com/Motherboard/B550M-AORUS-ELITE-rev-10-11-12" },
                { label: "Видеокарта", img: "img/pc/zotac.jpg", description: "ZOTAC GAMING GeForce RTX 4070 Twin Edge 12 ГБ", linkText: "ZOTAC GAMING RTX 4070 Twin Edge", linkUrl: "https://www.zotac.com/ru/product/graphics_card/zotac-gaming-geforce-rtx-4070-twin-edge-0" },
                { label: "Оперативная память", img: "img/pc/kingston.jpg", description: "Kingston Fury DDR4-3600 32 ГБ (2×16)", linkText: "Kingston Fury DDR4-3600 2x16", linkUrl: "https://www.citilink.ru/product/operativnaya-pamyat-kingston-fury-beast-black-kf436c18bb-16-ddr4-1x-16-1560752/" },
                { label: "Блок питания", img: "img/pc/power_unit.webp", description: "MONTECH CENTURY 550, 550 Вт, 80+ Bronze", linkText: "MONTECH CENTURY 550", linkUrl: "https://www.dns-shop.ru/product/995d23083bbaed20" },
                { label: "Кулер CPU", img: "img/pc/cooler.webp", description: "DEEPCOOL GAMMAXX 400K (LGA1700, 120 мм)", linkText: "DEEPCOOL GAMMAXX 400K", linkUrl: "https://www.dns-shop.ru/product/062d3b5b622bed20" },
                { label: "Накопитель SSD (256 ГБ)", img: "img/pc/NVMe_256.webp", description: "256 ГБ M.2 NVMe Patriot P300", linkText: "Patriot P300 256 ГБ", linkUrl: "https://www.dns-shop.ru/product/537ef8e45c183332" },
                { label: "Накопитель SSD (1 ТБ)", img: "img/pc/NVMe_1000.webp", description: "1000 ГБ M.2 NVMe ADATA XPG GAMMIX S11 Pro", linkText: "ADATA XPG GAMMIX S11 Pro 1ТБ", linkUrl: "https://www.dns-shop.ru/product/134e19be243b1b80" },
                { label: "Корпус", img: "img/pc/corpus.webp", description: "PowerCase Mistral Micro D3B ARGB V2 (черный)", linkText: "PowerCase Mistral Micro D3B", linkUrl: "https://www.dns-shop.ru/product/7e2fcf84847e8a40/" },
                { label: "Монитор", img: "img/pc/monik2.webp", description: "MSI MAG 275QF E21, 27\", IPS, 165 Гц", linkText: "MSI MAG 275QF E21", linkUrl: "https://ru.msi.com/Monitor/MAG-275QF-E21/Overview" },
                { label: "Клавиатура", img: "img/pc/klava.webp", description: "Redragon Caraxes Pro (60%, механическая)", linkText: "Redragon Caraxes Pro", linkUrl: "https://redragon.ru/catalog/keyboards/10686?ysclid=mbj3zofi4n479313654" },
                { label: "Мышь", img: "img/pc/mouse.png", description: "DELUX M800DC (PAW3370, игровая)", linkText: "DELUX M800DC", linkUrl: "https://www.deluxworld.com/en-pro-detail-M800pro.html" },
                { label: "Наушники", img: "img/pc/headphones.jpg", description: "Razer Barracuda X (беспроводные, 7.1)", linkText: "Razer Barracuda X", linkUrl: "https://www.razer.ru/product/gameaudio/razer-barracuda-x?sku=RZ04-04430100-R3M1" },
                { label: "Микрофон", img: "img/pc/Microphone.jpg", description: "FIFINE AmpliGame A6V (USB, кардиоидный)", linkText: "FIFINE AmpliGame A6V", linkUrl: "https://fifinemicrophone.com/products/fifine-ampligame-a6v-usb-microphone" }
            ];

            const grid = document.getElementById('buttonGrid');
            if (!grid) return;

            function createCard(item, index) {
                const card = document.createElement('div');
                card.className = 'button-card';

                const btn = document.createElement('button');
                btn.className = 'accordion-btn';
                btn.textContent = item.label;
                btn.setAttribute('aria-expanded', 'false');
                btn.dataset.index = index;

                const panel = document.createElement('div');
                panel.className = 'spoiler-panel';
                panel.id = `spoiler-${index}`;

                const content = document.createElement('div');
                content.className = 'spoiler-content';

                // --- ОПИСАНИЕ (текст над картинкой) ---
                const desc = document.createElement('div');
                desc.className = 'spoiler-description';
                desc.textContent = item.description || item.label;

                // --- ОБЕРТКА ДЛЯ КАРТИНКИ (чтобы управлять увеличением) ---
                const wrapper = document.createElement('div');
                wrapper.className = 'img-wrapper';

                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.label;
                img.loading = 'lazy';
                img.style.backgroundColor = '#1e1e2a';

                wrapper.appendChild(img);

                // --- ССЫЛКА ---
                const link = document.createElement('a');
                link.href = item.linkUrl;
                link.textContent = item.linkText;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                // Собираем контент: описание, картинка, ссылка
                content.appendChild(desc);
                content.appendChild(wrapper);
                content.appendChild(link);

                panel.appendChild(content);
                card.appendChild(btn);
                card.appendChild(panel);

                // --- ЛОГИКА УВЕЛИЧЕНИЯ КАРТИНКИ ПО КЛИКУ ---
                wrapper.addEventListener('click', function(e) {
                    e.stopPropagation(); // чтобы не закрывать спойлер
                    const isExpanded = wrapper.classList.contains('expanded');
                    if (isExpanded) {
                        wrapper.classList.remove('expanded');
                    } else {
                        wrapper.classList.add('expanded');
                    }
                });

                // --- КЛИК ПО КНОПКЕ (аккордеон) ---
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isActive = panel.classList.contains('active');

                    document.querySelectorAll('.spoiler-panel').forEach(p => {
                        if (p !== panel) {
                            p.classList.remove('active');
                            const prevBtn = p.closest('.button-card')?.querySelector('.accordion-btn');
                            if (prevBtn) prevBtn.setAttribute('aria-expanded', 'false');
                            // также сбрасываем увеличение у закрытых панелей (опционально)
                            const wrapperInside = p.querySelector('.img-wrapper');
                            if (wrapperInside) wrapperInside.classList.remove('expanded');
                        }
                    });

                    if (!isActive) {
                        panel.classList.add('active');
                        btn.setAttribute('aria-expanded', 'true');
                    } else {
                        panel.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                        // при закрытии спойлера сбрасываем увеличение картинки
                        wrapper.classList.remove('expanded');
                    }
                });

                return card;
            }

            items.forEach((item, idx) => {
                const card = createCard(item, idx);
                grid.appendChild(card);
            });
        })();
    </script>
</body>
</html>
