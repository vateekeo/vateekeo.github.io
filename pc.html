<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Мой ПК</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0e0e12;
            background-image: radial-gradient(circle at 20% 20%, #1a1a24 0%, #0a0a0e 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
        }

        .site-wrapper {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 3.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .main-title {
            text-align: center;
            font-size: clamp(2.6rem, 12vw, 4.6rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #f0f3fa;
            text-shadow: 0 0 12px rgba(100, 180, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.6);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            word-break: break-word;
        }

        /* ВКЛАДКИ */
        .tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .tab-btn {
            padding: 0.6rem 2rem;
            background: #1e1e28;
            border: 1px solid #3b3b4a;
            border-radius: 2rem;
            color: #aab0c4;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.03em;
            box-shadow: 0 4px 0 #0b0b0f;
        }

        .tab-btn:hover {
            background: #2a2a3a;
            color: #d6dff5;
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: #32324a;
            color: #f0f3fa;
            border-color: #6a6a8a;
            box-shadow: 0 4px 0 #0b0b0f, 0 0 20px rgba(100, 150, 255, 0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* СЕТКА КНОПОК (вкладка "Плиткой") */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            justify-content: center;
        }

        .button-card {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .accordion-btn {
            width: 100%;
            padding: 1rem 0.8rem;
            background: #21212b;
            border: 1px solid #3b3b4a;
            border-radius: 2rem;
            color: #eaeef7;
            font-size: 1rem;
            font-weight: 550;
            letter-spacing: 0.03em;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #0b0b0f, 0 8px 16px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            background: linear-gradient(145deg, #292936, #1b1b24);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            line-height: 1.4;
            word-break: break-word;
            min-height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .accordion-btn:hover {
            background: #323244;
            border-color: #5f5f7a;
            transform: scale(1.02);
            box-shadow: 0 6px 0 #0b0b0f, 0 10px 20px rgba(0, 0, 0, 0.7);
        }

        .accordion-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0b0b0f;
        }

        .spoiler-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
            background: rgba(14, 14, 20, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 0 0 1.8rem 1.8rem;
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.4);
            width: 100%;
            pointer-events: none;
        }

        .spoiler-panel.active {
            max-height: 800px;
            opacity: 1;
            margin-top: 0.6rem;
            padding: 0.8rem 0.8rem 1.2rem;
            pointer-events: auto;
            transition: max-height 0.5s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s ease, margin 0.3s ease;
        }

        .spoiler-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
        }

        .spoiler-description {
            color: #c8d6f0;
            font-size: 0.95rem;
            font-weight: 450;
            text-align: center;
            padding: 0.2rem 0.4rem;
            line-height: 1.5;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 0.5rem;
            margin-bottom: 0.2rem;
            letter-spacing: 0.02em;
            word-break: break-word;
        }

        .spoiler-content img {
            width: 100%;
            max-width: 220px;
            height: auto;
            aspect-ratio: auto;
            object-fit: contain;
            border-radius: 1.4rem;
            border: 1px solid #3d3d52;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
            background: #14141c;
            transition: 0.2s;
            display: block;
        }

        .spoiler-content a {
            color: #b4caf0;
            font-size: 0.95rem;
            font-weight: 450;
            letter-spacing: 0.02em;
            text-decoration: none;
            border-bottom: 1px dashed rgba(180, 202, 240, 0.3);
            padding: 0.25rem 0.4rem;
            transition: 0.2s;
            word-break: break-word;
            text-align: center;
            width: 100%;
        }

        .spoiler-content a:hover {
            color: #d6e5ff;
            border-bottom: 1px solid #8ab3ff;
            text-shadow: 0 0 6px rgba(100, 170, 255, 0.3);
        }

        .spoiler-panel:not(.active) .spoiler-content {
            pointer-events: none;
        }

        /* ===== ВКЛАДКА "СПИСКОМ" ===== */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.2rem 0;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: rgba(26, 26, 36, 0.6);
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s ease;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .list-item:hover {
            background: rgba(40, 40, 56, 0.7);
        }

        .list-item .item-label {
            font-weight: 700;
            color: #e8ecf7;
            font-size: 1rem;
            letter-spacing: 0.02em;
            min-width: 140px;
        }

        .list-item .item-link {
            color: #8ab3ff;
            text-decoration: none;
            font-weight: 450;
            font-size: 0.95rem;
            border-bottom: 1px dashed rgba(138, 179, 255, 0.25);
            padding: 0.1rem 0.2rem;
            transition: 0.2s;
            word-break: break-word;
            text-align: right;
            flex: 1;
            min-width: 120px;
        }

        .list-item .item-link:hover {
            color: #b8d0ff;
            border-bottom-color: #8ab3ff;
            text-shadow: 0 0 8px rgba(100, 170, 255, 0.2);
        }

        /* Адаптация для списка */
        @media (max-width: 600px) {
            .list-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 0.7rem 1rem;
            }

            .list-item .item-link {
                text-align: left;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .site-wrapper {
                padding: 1.5rem 0.8rem;
                border-radius: 2.2rem;
            }

            .buttons-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.9rem;
            }

            .accordion-btn {
                font-size: 0.9rem;
                padding: 0.8rem 0.4rem;
                min-height: 56px;
                border-radius: 1.8rem;
            }

            .spoiler-content img {
                max-width: 150px;
            }

            .spoiler-panel.active {
                max-height: 700px;
            }

            .tab-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .buttons-grid {
                grid-template-columns: 1fr;
                gap: 0.9rem;
            }
        }

        @media (min-width: 1100px) {
            .buttons-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <h1 class="main-title">Мой ПК</h1>

        <!-- ВКЛАДКИ -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-grid">Плиткой</button>
            <button class="tab-btn" data-tab="tab-list">Списком</button>
        </div>

        <!-- ВКЛАДКА "ПЛИТКОЙ" -->
        <div id="tab-grid" class="tab-content active">
            <div class="buttons-grid" id="buttonGrid"></div>
        </div>

        <!-- ВКЛАДКА "СПИСКОМ" -->
        <div id="tab-list" class="tab-content">
            <div class="list-view" id="listView"></div>
        </div>
    </div>

    <script>
        (function() {
            const items = [{
                label: "Процессор",
                img: "img/pc/amd.jpg",
                description: "AMD Ryzen 5 5600 (AM4, 6 ядер, 12 потоков, 3.5 ГГц)",
                linkText: "AMD Ryzen5 5600",
                linkUrl: "https://www.citilink.ru/product/processor-amd-ryzen-5-5600-am4-oem-100-000000927-1970792/"
            }, {
                label: "Материнская плата",
                img: "img/pc/mother_board.png",
                description: "Gigabyte B550M AORUS ELITE, SocketAM4, AMD B550, mATX, Ret",
                linkText: "Gigabyte B550M AORUS ELITE",
                linkUrl: "https://www.gigabyte.com/Motherboard/B550M-AORUS-ELITE-rev-10-11-12"
            }, {
                label: "Видеокарта",
                img: "img/pc/zotac.jpg",
                description: "ZOTAC GAMING GeForce RTX 4070 Twin Edge 12 r5 (2t-D40700e10m)",
                linkText: "ZOTAC GAMING GeForce RTX 4070 Twin Edge 12 ГБ",
                linkUrl: "https://www.zotac.com/ru/product/graphics_card/zotac-gaming-geforce-rtx-4070-twin-edge-0"
            }, {
                label: "Оперативная память",
                img: "img/pc/kingston.jpg",
                description: "Kingston Fury DDR4-3600 32 ГБ (2×16) (KF436C18BB/16×2)",
                linkText: "Kingston Fury DDR4-3600 32 ГБ (2×16)ГБ",
                linkUrl: "https://www.citilink.ru/product/operativnaya-pamyat-kingston-fury-beast-black-kf436c18bb-16-ddr4-1x-16-1560752/"
            }, {
                label: "Блок питания",
                img: "img/pc/power_unit.webp",
                description: "MONTECH CENTURY 550, 550 Вт, 80+ Bronze",
                linkText: "MONTECH CENTURY 550 [CENTURY 550]",
                linkUrl: "https://www.dns-shop.ru/product/995d23083bbaed20"
            }, {
                label: "Кулер CPU",
                img: "img/pc/cooler.webp",
                description: "DEEPCOOL GAMMAXX 400K (LGA1700, 120 мм)",
                linkText: "DEEPCOOL GAMMAXX 400K [LGA1700] [DP-MCH4-GMX400V2-K]",
                linkUrl: "https://www.dns-shop.ru/product/062d3b5b622bed20"
            }, {
                label: "Накопитель SSD (256 ГБ)",
                img: "img/pc/NVMe_256.webp",
                description: "256 ГБ M.2 NVMe Patriot P300",
                linkText: "256 ГБ M.2 NVMe накопитель Patriot P300 [P300P256GM28]",
                linkUrl: "https://www.dns-shop.ru/product/537ef8e45c183332"
            }, {
                label: "Накопитель SSD (1 ТБ)",
                img: "img/pc/NVMe_1000.webp",
                description: "1000 ГБ M.2 NVMe ADATA XPG GAMMIX S11 Pro",
                linkText: "1000 ГБ M.2 NVMe накопитель ADATA XPG GAMMIX S11 Pro [AGAMMIXS11P-1TT-C]",
                linkUrl: "https://www.dns-shop.ru/product/134e19be243b1b80"
            }, {
                label: "Корпус",
                img: "img/pc/corpus.webp",
                description: "PowerCase Mistral Micro D3B ARGB V2 (черный)",
                linkText: "PowerCase Mistral Micro D3B ARGB V2 [CMMDB-A3-V2] черный",
                linkUrl: "https://www.dns-shop.ru/product/7e2fcf84847e8a40/"
            }, {
                label: "Монитор",
                img: "img/pc/monik2.webp",
                description: "MSI MAG 275QF E21, 27\", IPS, 210 Гц",
                linkText: "MSI MAG 275QF E21 27'",
                linkUrl: "https://ru.msi.com/Monitor/MAG-275QF-E21/Overview"
            }, {
                label: "Клавиатура",
                img: "img/pc/klava.webp",
                description: "Redragon Caraxes Pro (60%, механическая)",
                linkText: "Redragon Caraxes Pro(60%)",
                linkUrl: "https://redragon.ru/catalog/keyboards/10686?ysclid=mbj3zofi4n479313654"
            }, {
                label: "Мышь",
                img: "img/pc/mouse.png",
                description: "DELUX M800DC (PAW3370, игровая)",
                linkText: "DELUX M800DC(PAW3370)",
                linkUrl: "https://www.deluxworld.com/en-pro-detail-M800pro.html"
            }, {
                label: "Наушники",
                img: "img/pc/headphones.jpg",
                description: "Razer Barracuda X (беспроводные, 7.1)",
                linkText: "Razer Barracuda X",
                linkUrl: "https://www.razer.ru/product/gameaudio/razer-barracuda-x?sku=RZ04-04430100-R3M1"
            }, {
                label: "Микрофон",
                img: "img/pc/Microphone.jpg",
                description: "FIFINE AmpliGame A6V (USB, кардиоидный)",
                linkText: "FIFINE AmpliGame A6V",
                linkUrl: "https://fifinemicrophone.com/products/fifine-ampligame-a6v-usb-microphone"
            }];

            // ===== РЕНДЕР ПЛИТКИ =====
            const grid = document.getElementById('buttonGrid');
            if (grid) {
                function createCard(item, index) {
                    const card = document.createElement('div');
                    card.className = 'button-card';

                    const btn = document.createElement('button');
                    btn.className = 'accordion-btn';
                    btn.textContent = item.label;
                    btn.setAttribute('aria-expanded', 'false');
                    btn.dataset.index = index;

                    const panel = document.createElement('div');
                    panel.className = 'spoiler-panel';
                    panel.id = `spoiler-${index}`;

                    const content = document.createElement('div');
                    content.className = 'spoiler-content';

                    const desc = document.createElement('p');
                    desc.className = 'spoiler-description';
                    desc.textContent = item.description;

                    const img = document.createElement('img');
                    img.src = item.img;
                    img.alt = item.label;
                    img.loading = 'lazy';
                    img.style.backgroundColor = '#1e1e2a';

                    const link = document.createElement('a');
                    link.href = item.linkUrl;
                    link.textContent = item.linkText;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    content.appendChild(desc);
                    content.appendChild(img);
                    content.appendChild(link);
                    panel.appendChild(content);

                    card.appendChild(btn);
                    card.appendChild(panel);

                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const isActive = panel.classList.contains('active');

                        document.querySelectorAll('.spoiler-panel').forEach(p => {
                            if (p !== panel) {
                                p.classList.remove('active');
                                const prevBtn = p.closest('.button-card')?.querySelector(
                                '.accordion-btn');
                                if (prevBtn) prevBtn.setAttribute('aria-expanded', 'false');
                            }
                        });

                        if (!isActive) {
                            panel.classList.add('active');
                            btn.setAttribute('aria-expanded', 'true');
                        } else {
                            panel.classList.remove('active');
                            btn.setAttribute('aria-expanded', 'false');
                        }
                    });

                    return card;
                }

                items.forEach((item, idx) => {
                    const card = createCard(item, idx);
                    grid.appendChild(card);
                });
            }

            // ===== РЕНДЕР СПИСКА =====
            const listView = document.getElementById('listView');
            if (listView) {
                items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'list-item';

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'item-label';
                    labelSpan.textContent = item.label;

                    const link = document.createElement('a');
                    link.className = 'item-link';
                    link.href = item.linkUrl;
                    link.textContent = item.linkText;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    row.appendChild(labelSpan);
                    row.appendChild(link);
                    listView.appendChild(row);
                });
            }

            // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = {
                'tab-grid': document.getElementById('tab-grid'),
                'tab-list': document.getElementById('tab-list')
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Убираем активные классы
                    tabBtns.forEach(b => b.classList.remove('active'));
                    Object.values(tabContents).forEach(c => c.classList.remove('active'));

                    // Активируем текущие
                    this.classList.add('active');
                    const targetId = this.dataset.tab;
                    if (tabContents[targetId]) {
                        tabContents[targetId].classList.add('active');
                    }
                });
            });
        })();
    </script>
</body>
</html>
